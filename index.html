        const KEY = "lb-test:";
        const load = (id) => {
            try { return JSON.parse(localStorage.getItem(KEY + id)) || {}; } catch { return {}; }
        };
        const save = (id, data) => {
            try { localStorage.setItem(KEY + id, JSON.stringify(data)); } catch {}
        };
        // dữ liệu cũ: localStorage[id] = "true" (chỉ có tick)
        const migrate = (id) => {
            try {
                if (localStorage.getItem(id) === "true" && !localStorage.getItem(KEY + id)) save(id, { status: "pass" });
                localStorage.removeItem(id);
            } catch {}
        };

        const root = document.getElementById("sections");
        for (const section of sections) {
            const h2 = document.createElement("h2");
            h2.innerHTML = section.title + (section.isNew ? '<span class="new">mới</span>' : "");
            root.appendChild(h2);
            for (const [id, title, steps, expected, hint, before] of section.cases) {
                migrate(id);
                const el = document.createElement("div");
                el.className = "test-case";
                el.dataset.id = id;
                el.innerHTML = `
                    <div class="actions">
                        <button type="button" class="mark pass" title="Đạt" aria-label="Đánh dấu đạt">✓</button>
                        <button type="button" class="mark fail" title="Lỗi (failed)" aria-label="Đánh dấu lỗi">✕</button>
                        <button type="button" class="mark skip" title="Bỏ qua — chưa cần test" aria-label="Bỏ qua mục này">⏭</button>
                    </div>
                    <div class="content">
                        <strong>${title}</strong>
                        ${before ? `<small class="before">🐞 Trước khi sửa: ${before}</small>` : ""}
                        ${Array.isArray(steps)
                            ? `<div class="steps-label">Các bước:</div><ol class="steps">${steps.map((x) => `<li>${x}</li>`).join("")}</ol>`
                            : `<span>Thao tác: ${steps}</span>`}
                        <em>Mong đợi: ${expected}</em>
                        ${hint ? `<small class="hint">📝 ${hint}</small>` : ""}
                        <textarea class="note" rows="1" placeholder="Ghi chú lỗi khi test..."></textarea>
                    </div>`;
                const data = load(id);
                const note = el.querySelector(".note");
                note.value = data.note || "";
                apply(el, data.status);
                el.querySelector(".mark.pass").addEventListener("click", () => toggle(el, "pass"));
                el.querySelector(".mark.fail").addEventListener("click", () => toggle(el, "fail"));
                el.querySelector(".mark.skip").addEventListener("click", () => toggle(el, "skip"));
                note.addEventListener("input", () => {
                    save(id, { ...load(id), note: note.value });
                    refresh();
                });
                root.appendChild(el);
            }
        }

        function apply(el, status) {
            el.classList.toggle("passed", status === "pass");
            el.classList.toggle("failed", status === "fail");
            el.classList.toggle("skipped", status === "skip");
        }
        function toggle(el, status) {
            const data = load(el.dataset.id);
            data.status = data.status === status ? undefined : status;
            save(el.dataset.id, data);
            apply(el, data.status);
            refresh();
            if (data.status === "fail") el.querySelector(".note").focus();
        }

        const filter = document.getElementById("filter");
        filter.addEventListener("change", refresh);
        function refresh() {
            const cases = [...document.querySelectorAll(".test-case")];
            let pass = 0, fail = 0, skip = 0;
            for (const el of cases) {
                const data = load(el.dataset.id);
                if (data.status === "pass") pass++;
                if (data.status === "fail") fail++;
                if (data.status === "skip") skip++;
                const show =
                    filter.value === "all" ||
                    (filter.value === "todo" && !data.status) ||
                    (filter.value === "failed" && data.status === "fail") ||
                    (filter.value === "skipped" && data.status === "skip") ||
                    (filter.value === "active" && data.status !== "skip") ||
                    (filter.value === "noted" && (data.note || "").trim());
                el.style.display = show ? "" : "none";
            }
            document.getElementById("count-pass").textContent = `${pass} đạt`;
            document.getElementById("count-fail").textContent = `${fail} lỗi`;
            document.getElementById("count-todo").textContent = `${cases.length - pass - fail - skip} chưa test`;
            document.getElementById("count-skip").textContent = `${skip} bỏ qua`;
        }
        refresh();

        function copyFailed() {
            const lines = [...document.querySelectorAll(".test-case")]
                .map((el) => ({ el, data: load(el.dataset.id) }))
                .filter(({ data }) => data.status === "fail")
                .map(({ el, data }) => `- ${el.querySelector("strong").textContent}${data.note ? `\n  ${data.note.replace(/\n/g, "\n  ")}` : ""}`);
            const text = lines.length ? lines.join("\n") : "Chưa có mục nào bị đánh dấu lỗi.";
            navigator.clipboard?.writeText(text).then(
                () => alert(`Đã copy ${lines.length} mục lỗi.`),
                () => prompt("Copy nội dung bên dưới:", text),
            );
        }

        function resetAll() {
            if (confirm("Bạn có chắc chắn muốn xóa toàn bộ đánh dấu và ghi chú không?")) {
                document.querySelectorAll(".test-case").forEach((el) => {
                    try { localStorage.removeItem(KEY + el.dataset.id); } catch {}
                    apply(el, undefined);
                    el.querySelector(".note").value = "";
                });
                refresh();
            }
        }
    </script>
</body>
</html>
